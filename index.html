<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>RNLC 2월 팀 대항전</title>
  <style>
    :root{
      --b:#111; --muted:#666; --card:#fcfcfc; --line:#eee;
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,"Noto Sans KR",sans-serif;
      background:#fff;
      color:#111;
    }
    .wrap{
      width:min(760px, 92vw);
      margin:0 auto;
      padding:18px 0 44px;
    }
    h1{
      margin:14px 0 18px;
      text-align:center;
      font-weight:900;
      font-size:34px;
      letter-spacing:0.02em;
    }

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:#fff;
      padding:14px;
    }

    .fieldGroup{ margin:12px 0; }
    .label{
      display:block;
      font-size:14px;
      margin:0 0 8px;
      font-weight:900;
    }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .grow{ flex:1; }

    .input{
      width:100%;
      height:56px;
      border:3px solid var(--b);
      border-radius:14px;
      padding:10px 14px;
      font-size:18px;
      outline:none;
    }

    .btn{
      height:56px;
      border:2px solid var(--b);
      border-radius:14px;
      background:#fff;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      width:100%;
    }
    .btn.small{
      width:120px;
      font-size:16px;
    }

    .unitWrap{ position:relative; }
    .unit{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      font-size:16px;
      font-weight:900;
    }
    .input.unitPad{ padding-right:58px; }

    .hint{
      color:var(--muted);
      font-size:12px;
      margin-top:6px;
      line-height:1.4;
    }

    .section{ margin-top:16px; }
    .sectionHead{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
      margin:0 0 10px;
    }
    .sectionHead h2{
      margin:0;
      font-size:16px;
      font-weight:900;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .miniCard{
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--card);
      padding:12px;
    }
    .big{
      font-size:22px;
      font-weight:1000;
    }
    .mono{
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    .rankList{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
    }
    .rankRow{
      display:grid;
      grid-template-columns:44px 1fr 92px;
      gap:10px;
      padding:12px;
      border-bottom:1px solid var(--line);
      align-items:center;
      font-size:14px;
    }
    .rankRow:last-child{ border-bottom:none; }
    .pill{
      display:inline-block;
      border:1px solid #ddd;
      border-radius:999px;
      padding:3px 8px;
      font-size:12px;
      margin-left:8px;
      color:#333;
    }
    .right{ text-align:right; }

    /* 하단 버튼 바 */
    .bottomBar{
      margin-top:16px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
      align-items:center;
    }
    .adminBtn{
      height:46px;
      padding:0 14px;
      border:1px solid var(--b);
      border-radius:12px;
      background:#fff;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
      text-decoration:none;
      color:#111;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* 팝업 */
    .toastMask{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.25);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9999;
    }
    .toast{
      width:min(420px, 92vw);
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px 16px 14px;
      box-shadow:0 12px 30px rgba(0,0,0,0.12);
      text-align:center;
    }
    .toastTitle{
      font-size:18px;
      font-weight:1000;
      margin:4px 0 8px;
    }
    .toastBody{
      font-size:14px;
      color:#333;
      margin:0 0 12px;
      white-space:pre-line;
    }
    .toastBtn{
      width:100%;
      height:48px;
      border:2px solid var(--b);
      border-radius:14px;
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }

    @media (min-width: 900px){
      .wrap{ width:min(900px, 92vw); }
      h1{ font-size:44px; }
      .grid2{ grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>RNLC 2월 팀 대항전</h1>

    <div class="card">
      <div class="fieldGroup">
        <label class="label">이름</label>
        <div class="row">
          <input id="name" class="input grow" autocomplete="off" placeholder="이름 입력"/>
          <button id="lookupBtn" class="btn small" type="button">입력</button>
        </div>
        <div class="hint">* 이름 입력 후 [입력] 버튼으로 팀 확인</div>
      </div>

      <div class="fieldGroup">
        <label class="label">팀</label>
        <input id="team" class="input" readonly placeholder="이름 입력 후 자동 표시"/>
      </div>

      <div class="fieldGroup">
        <label class="label">거리입력</label>
        <div class="unitWrap">
          <input id="distance" class="input unitPad" inputmode="decimal" placeholder="숫자만 입력"/>
          <div class="unit">km</div>
        </div>
        <div class="hint">* 인증 캡처는 단톡방에 업로드(운영)</div>
        <div class="hint">* 200km 초과 입력은 기록은 남지만 누계/랭킹에는 합산되지 않습니다.</div>
      </div>

      <div class="fieldGroup">
        <button id="submitBtn" class="btn" type="button">입력 완료</button>
      </div>
    </div>

    <div class="section">
      <div class="sectionHead">
        <h2>누계 현황</h2>
        <div class="hint" id="sumHint">불러오는 중...</div>
      </div>

      <div class="grid2">
        <div class="miniCard">
          <div class="hint">내 누계</div>
          <div class="big mono" id="myTotal">-</div>
        </div>
        <div class="miniCard">
          <div class="hint">내 팀</div>
          <div class="big mono" id="myTeam">-</div>
        </div>
        <div class="miniCard">
          <div class="hint">팀 1~4위</div>
          <div class="big mono" id="teamRankLine">-</div>
        </div>
        <div class="miniCard">
          <div class="hint">현재 1위 팀 누계</div>
          <div class="big mono" id="bestTeamTotal">-</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sectionHead">
        <h2>개인 TOP 10</h2>
        <div class="hint">entries 기준 자동 집계</div>
      </div>
      <div class="rankList" id="top10Box"></div>
    </div>

    <!-- ✅ 하단 관리자 버튼(버튼 방식) -->
    <div class="bottomBar">
      <a class="adminBtn" href="./admin.html">DB(관리자)</a>
    </div>
  </div>

  <!-- 팝업 -->
  <div class="toastMask" id="toastMask">
    <div class="toast">
      <div class="toastTitle" id="toastTitle">완료되었습니다</div>
      <div class="toastBody" id="toastBody"></div>
      <button class="toastBtn" id="toastBtn">확인</button>
    </div>
  </div>

<script>
  // ✅ 네 웹앱 주소
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWKsaTaqK5dtACbEbLQsEOB9EyTKfsIL3pplpjxt03buRW5wJ8ZylrvESr0mbC4q52/exec";

  function parseKm(v){
    const n = Number(String(v).trim().replace(",", "."));
    return Number.isFinite(n) ? n : NaN;
  }
  function fmtKm(n){
    const x = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    return x.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + " km";
  }
  function escapeHtml(s){
    return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }

  // JSONP
  function apiJsonp(params){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.callback = cb;

      const url = new URL(SCRIPT_URL);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

      const script = document.createElement("script");
      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      script.src = url.toString();
      document.body.appendChild(script);

      function cleanup(){
        try{ delete window[cb]; }catch(e){}
        script.remove();
      }
    });
  }

  // popup
  function showPopup(title, body){
    document.getElementById("toastTitle").textContent = title || "완료되었습니다";
    document.getElementById("toastBody").textContent = body || "";
    document.getElementById("toastMask").style.display = "flex";
  }
  function hidePopup(){ document.getElementById("toastMask").style.display = "none"; }
  document.getElementById("toastBtn").addEventListener("click", hidePopup);
  document.getElementById("toastMask").addEventListener("click", (e)=>{ if(e.target.id==="toastMask") hidePopup(); });

  async function lookupTeam(){
    const name = document.getElementById("name").value.trim();
    if(!name) return showPopup("확인", "이름을 입력하세요.");

    const out = await apiJsonp({ action:"lookupTeam", name });
    if(!out.ok) return showPopup("확인", "DB에 없는 이름입니다. (DB 시트 확인)");

    document.getElementById("team").value = out.team;
    await refreshMyTotal();
    document.getElementById("distance").focus();
  }

  async function submit(){
    const name = document.getElementById("name").value.trim();
    const team = document.getElementById("team").value.trim();
    const distRaw = document.getElementById("distance").value.trim();
    const km = parseKm(distRaw);

    if(!name) return showPopup("확인", "이름을 입력하세요.");
    if(!team) return showPopup("확인", "[입력] 버튼으로 팀을 먼저 확인하세요.");
    if(!Number.isFinite(km) || km <= 0) return showPopup("확인", "거리(km)를 0보다 큰 숫자로 입력하세요.");

    const out = await apiJsonp({ action:"submit", name, distance: distRaw });
    if(!out.ok) return showPopup("오류", out.error || "저장 실패");

    const base = `${out.date}\n${out.name} / ${out.team}팀 / ${out.distance}km\n기록 저장 완료`;
    const msg = (out.counted === false) ? base + `\n※ 200km 초과로 누계/랭킹 집계 제외` : base;
    showPopup("완료되었습니다", msg);

    document.getElementById("distance").value = "";
    await Promise.all([refreshLeaderboard(), refreshMyTotal()]);
  }

  async function refreshMyTotal(){
    const name = document.getElementById("name").value.trim();
    if(!name){
      document.getElementById("myTotal").textContent = "-";
      document.getElementById("myTeam").textContent = "-";
      return;
    }
    const out = await apiJsonp({ action:"personTotal", name });
    if(!out.ok) return;
    document.getElementById("myTotal").textContent = fmtKm(out.total || 0);
    document.getElementById("myTeam").textContent = out.team || "-";
  }

  async function refreshLeaderboard(){
    const hint = document.getElementById("sumHint");
    hint.textContent = "불러오는 중...";

    const out = await apiJsonp({ action:"leaderboard" });
    if(!out.ok){
      hint.textContent = "랭킹 불러오기 실패";
      return;
    }

    const ranks = out.teamRanks || [];
    document.getElementById("teamRankLine").textContent =
      ranks.map((x,i)=> `${i+1}위 ${x.team}`).join(" / ") || "-";
    document.getElementById("bestTeamTotal").textContent =
      ranks[0] ? `${ranks[0].team} : ${fmtKm(ranks[0].total)}` : "-";

    const top10 = out.top10 || [];
    const box = document.getElementById("top10Box");
    box.innerHTML = top10.length
      ? top10.map((p,i)=> `
        <div class="rankRow">
          <div class="mono">${i+1}</div>
          <div>${escapeHtml(p.name)} <span class="pill">${escapeHtml(p.team || '-')}팀</span></div>
          <div class="right mono">${fmtKm(p.total)}</div>
        </div>
      `).join("")
      : `<div class="rankRow"><div class="mono">-</div><div>데이터 없음</div><div class="right mono">-</div></div>`;

    const now = new Date();
    hint.textContent = `업데이트 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  }

  document.getElementById("lookupBtn").addEventListener("click", lookupTeam);
  document.getElementById("submitBtn").addEventListener("click", submit);

  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const id = document.activeElement?.id;
    if(id === "name") lookupTeam();
    else if(id === "distance") submit();
  });

  refreshLeaderboard();
</script>
</body>
</html>
