<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>RNLC 2월 팀 대항전</title>
  <style>
    :root{
      --b:#111; --muted:#666; --card:#fcfcfc; --line:#eee;
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family:system-ui,"Noto Sans KR",sans-serif;
      background:#fff; color:#111;
    }
    .wrap{
      width:min(720px, 92vw);
      margin:0 auto;
      padding:20px 0 36px;
    }
    h1{
      margin:14px 0 18px;
      text-align:center;
      font-weight:900;
      letter-spacing:0.02em;
      font-size:34px;
    }

    /* 모바일 퍼스트 폼 */
    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:#fff;
      padding:14px;
    }
    .fieldGroup{ margin:12px 0; }
    .label{
      display:block;
      font-size:14px;
      color:#222;
      margin:0 0 8px;
      font-weight:800;
    }
    .input{
      width:100%;
      height:56px;
      border:3px solid var(--b);
      border-radius:14px;
      padding:10px 14px;
      font-size:18px;
      outline:none;
    }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .row .grow{ flex:1; }
    .btn{
      width:100%;
      height:56px;
      border:2px solid var(--b);
      border-radius:14px;
      background:#fff;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
    }
    .btn.secondary{ border-color:#ccc; color:#333; }
    .btn.small{
      width:120px;
      font-size:16px;
      height:56px;
      font-weight:900;
    }

    .unitWrap{ position:relative; }
    .unit{
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      font-size:16px; font-weight:900;
    }
    .input.unitPad{ padding-right:58px; }

    .status{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
      min-height:18px;
      text-align:right;
    }

    /* 누계 */
    .summary{
      margin-top:14px;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
    .summaryHead{
      display:flex; justify-content:space-between; align-items:baseline; gap:10px;
      margin-bottom:10px;
    }
    .summaryHead h2{ margin:0; font-size:16px; font-weight:900; }
    .hint{ color:var(--muted); font-size:12px; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .miniCard{
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--card);
      padding:12px;
    }
    .big{
      font-size:22px; font-weight:1000;
      letter-spacing:0.01em;
    }
    .mono{ font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; }

    .links{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size:13px;
    }
    a{ color:#111; }

    @media (min-width: 900px){
      .wrap{ width:min(860px, 92vw); }
      h1{ font-size:44px; margin-bottom:24px; }
      .grid2{ grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>

<body>
<div class="wrap">
  <h1>RNLC 2월 팀 대항전</h1>

  <div class="card">
    <div class="fieldGroup">
      <label class="label">이름</label>
      <div class="row">
        <input id="name" class="input grow" autocomplete="off" placeholder="이름 입력"/>
        <button id="lookupBtn" class="btn small" type="button">입력</button>
      </div>
    </div>

    <div class="fieldGroup">
      <label class="label">팀</label>
      <input id="team" class="input" readonly placeholder="이름 입력 후 자동 표시"/>
    </div>

    <div class="fieldGroup">
      <label class="label">거리입력</label>
      <div class="unitWrap">
        <input id="distance" class="input unitPad" inputmode="decimal" placeholder="숫자만 입력"/>
        <div class="unit">km</div>
      </div>
    </div>

    <div class="fieldGroup">
      <button id="submitBtn" class="btn" type="button">입력 완료</button>
    </div>

    <div class="fieldGroup">
      <button id="proofBtn" class="btn secondary" type="button">인증 사진 업로드</button>
      <div class="hint" style="margin-top:8px;">* 인증 업로드는 별도 페이지(구글 웹앱)에서 진행됩니다.</div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <div class="summary">
    <div class="summaryHead">
      <h2>누계 현황</h2>
      <div class="hint" id="sumHint">불러오는 중...</div>
    </div>

    <div class="grid2">
      <div class="miniCard">
        <div class="hint">내 누계</div>
        <div class="big mono" id="myTotal">-</div>
      </div>
      <div class="miniCard">
        <div class="hint">내 팀</div>
        <div class="big mono" id="myTeam">-</div>
      </div>
      <div class="miniCard">
        <div class="hint">R팀 누계</div>
        <div class="big mono" id="sumR">0</div>
      </div>
      <div class="miniCard">
        <div class="hint">N팀 누계</div>
        <div class="big mono" id="sumN">0</div>
      </div>
      <div class="miniCard">
        <div class="hint">L팀 누계</div>
        <div class="big mono" id="sumL">0</div>
      </div>
      <div class="miniCard">
        <div class="hint">C팀 누계</div>
        <div class="big mono" id="sumC">0</div>
      </div>
    </div>
  </div>

  <div class="links">
    <a href="./admin.html">DB(관리자)</a>
    <span class="hint">모바일 최적화 v2</span>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWKsaTaqK5dtACbEbLQsEOB9EyTKfsIL3pplpjxt03buRW5wJ8ZylrvESr0mbC4q52/exec";

  function setStatus(msg, ok=true){
    const el = document.getElementById("status");
    el.textContent = msg || "";
    el.style.color = ok ? "#0a7" : "#c00";
    if(msg) setTimeout(()=>{ el.textContent=""; }, 2500);
  }

  function parseKm(v){
    const n = Number(String(v).trim().replace(",", "."));
    return Number.isFinite(n) ? n : NaN;
  }

  function fmtKm(n){
    const x = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    return x.toLocaleString("ko-KR", {maximumFractionDigits:2}) + " km";
  }

  // JSONP
  function apiJsonp(params){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.callback = cb;

      const url = new URL(SCRIPT_URL);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

      const script = document.createElement("script");
      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      script.src = url.toString();
      document.body.appendChild(script);

      function cleanup(){
        try{ delete window[cb]; }catch(e){}
        script.remove();
      }
    });
  }

  async function refreshTeamSummary(){
    const hint = document.getElementById("sumHint");
    hint.textContent = "불러오는 중...";
    try{
      const out = await apiJsonp({ action:"summary" });
      if(!out.ok) throw new Error(out.error || "summary failed");
      const t = out.teamTotals || {R:0,N:0,L:0,C:0};

      document.getElementById("sumR").textContent = fmtKm(t.R);
      document.getElementById("sumN").textContent = fmtKm(t.N);
      document.getElementById("sumL").textContent = fmtKm(t.L);
      document.getElementById("sumC").textContent = fmtKm(t.C);

      const now = new Date();
      hint.textContent = `업데이트 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    }catch(e){
      hint.textContent = "누계 불러오기 실패";
    }
  }

  async function refreshMyTotal(){
    const name = document.getElementById("name").value.trim();
    if(!name){
      document.getElementById("myTotal").textContent = "-";
      document.getElementById("myTeam").textContent = "-";
      return;
    }
    try{
      const out = await apiJsonp({ action:"personTotal", name });
      if(!out.ok) return;
      document.getElementById("myTotal").textContent = fmtKm(out.total || 0);
      document.getElementById("myTeam").textContent = out.team || "-";
    }catch(e){}
  }

  async function lookupTeam(){
    const name = document.getElementById("name").value.trim();
    if(!name) return setStatus("이름을 입력하세요.", false);

    try{
      const out = await apiJsonp({ action:"lookupTeam", name });
      if(!out.ok) return setStatus("DB에 없는 이름입니다. (DB 시트 확인)", false);

      document.getElementById("team").value = out.team;
      setStatus(`팀 확인: ${name} → ${out.team}`, true);

      await refreshMyTotal();

      document.getElementById("distance").focus();
    }catch(e){
      setStatus("DB 연결 실패(웹앱/배포).", false);
    }
  }

  async function submit(){
    const name = document.getElementById("name").value.trim();
    const team = document.getElementById("team").value.trim();
    const km = parseKm(document.getElementById("distance").value);

    if(!name) return setStatus("이름을 입력하세요.", false);
    if(!team) return setStatus("[입력] 버튼을 눌러 팀을 먼저 확인하세요.", false);
    if(!Number.isFinite(km) || km <= 0) return setStatus("거리(km)는 0보다 큰 숫자여야 합니다.", false);

    try{
      const out = await apiJsonp({ action:"add", name, distance: km });
      if(!out.ok) return setStatus("저장 실패: " + (out.error || ""), false);

      document.getElementById("team").value = out.team;
      setStatus(`저장 완료: ${out.date} / ${name} / ${out.team} / ${km}km`, true);

      document.getElementById("distance").value = "";

      // ✅ 저장 성공 후: 팀누계/개인누계 갱신
      await Promise.all([refreshTeamSummary(), refreshMyTotal()]);
    }catch(e){
      setStatus("저장 실패(웹앱/배포).", false);
    }
  }

  // ✅ 인증 업로드 버튼: Apps Script 내부 업로드 페이지로 이동
  function openProofPage(){
    const name = encodeURIComponent(document.getElementById("name").value.trim());
    const dist = encodeURIComponent(document.getElementById("distance").value.trim());
    const url = `${SCRIPT_URL}?page=proof&name=${name}&distance=${dist}`;
    window.open(url, "_blank");
  }

  document.getElementById("lookupBtn").addEventListener("click", lookupTeam);
  document.getElementById("submitBtn").addEventListener("click", submit);
  document.getElementById("proofBtn").addEventListener("click", openProofPage);

  // Enter UX
  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const id = document.activeElement?.id;
    if(id === "name") lookupTeam();
    else if(id === "distance") submit();
  });

  // 초기 누계 로드
  refreshTeamSummary();
</script>
</body>
</html>
