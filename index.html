<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RNLC 2월 팀 대항전</title>
  <style>
    :root{ --b:#111; --g:#e9e9e9; }
    body{ margin:0; font-family:system-ui,"Noto Sans KR",sans-serif; background:#fff; color:#111; }
    .wrap{ width:min(1100px,92vw); margin:0 auto; padding:44px 0 60px; }
    h1{ text-align:center; font-weight:700; margin:16px 0 44px; font-size:44px; letter-spacing:0.02em; }

    .form{
      display:grid;
      grid-template-columns: 180px 1fr 140px;
      gap:18px 16px;
      align-items:center;
    }
    .label{ text-align:right; font-size:34px; padding-right:14px; white-space:nowrap; }
    .field{
      width:100%;
      height:72px;
      border:5px solid var(--b);
      border-radius:10px;
      font-size:28px;
      padding:10px 14px;
      outline:none;
    }
    .btn{
      height:72px;
      border:3px solid var(--b);
      border-radius:14px;
      background:#fff;
      font-size:24px;
      cursor:pointer;
      white-space:nowrap;
    }
    .row2{ grid-column: 2 / 4; }
    .unitWrap{ position:relative; }
    .unit{ position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; color:#111; }
    .field.unitPad{ padding-right:70px; }

    .actions{
      display:flex;
      justify-content:flex-end;
      margin-top:26px;
      gap:12px;
    }
    .btnBig{
      border:3px solid var(--b);
      border-radius:14px;
      background:#fff;
      font-size:26px;
      padding:14px 22px;
      cursor:pointer;
    }
    .status{
      margin-top:10px;
      text-align:right;
      color:#666;
      min-height:18px;
      font-size:14px;
    }
    .links{
      margin-top:14px;
      text-align:right;
      font-size:14px;
    }
    a{ color:#111; }

    @media (max-width: 860px){
      h1{ font-size:34px; }
      .form{ grid-template-columns: 120px 1fr; }
      .label{ font-size:22px; }
      .btn{ grid-column: 1 / -1; height:56px; font-size:18px; }
      .field{ height:56px; font-size:20px; border-width:4px; }
      .actions{ justify-content:stretch; }
      .btnBig{ width:100%; font-size:20px; }
      .row2{ grid-column: 2 / 3; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>RNLC 2월 팀 대항전</h1>

    <div class="form">
      <div class="label">이름</div>
      <input id="name" class="field" autocomplete="off" placeholder="이름 입력"/>
      <button id="lookupBtn" class="btn" type="button">입력</button>

      <div class="label">팀</div>
      <input id="team" class="field" readonly placeholder="팀 자동 표시"/>
      <div></div>

      <div class="label">거리입력</div>
      <div class="unitWrap">
        <input id="distance" class="field unitPad" inputmode="decimal" placeholder="숫자만 입력"/>
        <div class="unit">km</div>
      </div>
      <div></div>
    </div>

    <div class="actions">
      <button id="submitBtn" class="btnBig" type="button">입력 완료</button>
    </div>

    <div id="status" class="status"></div>

    <div class="links">
      <a href="./admin.html">DB(관리자)</a>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWKsaTaqK5dtACbEbLQsEOB9EyTKfsIL3pplpjxt03buRW5wJ8ZylrvESr0mbC4q52/exec";

  function setStatus(msg, ok=true){
    const el = document.getElementById("status");
    el.textContent = msg || "";
    el.style.color = ok ? "#0a7" : "#c00";
    if(msg) setTimeout(()=>{ el.textContent=""; }, 2500);
  }

  function parseKm(v){
    const n = Number(String(v).trim().replace(",", "."));
    return Number.isFinite(n) ? n : NaN;
  }

  // JSONP 호출
  function apiJsonp(params){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.callback = cb;

      const url = new URL(SCRIPT_URL);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

      const script = document.createElement("script");
      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      script.src = url.toString();
      document.body.appendChild(script);

      function cleanup(){
        try{ delete window[cb]; }catch(e){}
        script.remove();
      }
    });
  }

  async function lookupTeam(){
    const name = document.getElementById("name").value.trim();
    if(!name) return setStatus("이름을 입력하세요.", false);

    try{
      const out = await apiJsonp({ action:"lookupTeam", name });
      if(!out.ok) return setStatus("DB에 없는 이름입니다. (DB 시트 확인)", false);
      document.getElementById("team").value = out.team;
      setStatus(`팀 확인: ${name} → ${out.team}`, true);
      document.getElementById("distance").focus();
    }catch(e){
      setStatus("DB 연결 실패(웹앱/배포/CORS). Apps Script 재배포 확인", false);
    }
  }

  async function submit(){
    const name = document.getElementById("name").value.trim();
    const team = document.getElementById("team").value.trim();
    const km = parseKm(document.getElementById("distance").value);

    if(!name) return setStatus("이름을 입력하세요.", false);
    if(!team) return setStatus("[입력] 버튼을 눌러 팀을 먼저 확인하세요.", false);
    if(!Number.isFinite(km) || km <= 0) return setStatus("거리(km)는 0보다 큰 숫자여야 합니다.", false);

    try{
      const out = await apiJsonp({ action:"add", name, distance: km });
      if(!out.ok) return setStatus("저장 실패: " + (out.error || ""), false);

      // 서버가 팀을 다시 DB에서 확정해서 내려줌
      document.getElementById("team").value = out.team;
      setStatus(`저장 완료: ${out.date} / ${name} / ${out.team} / ${km}km`, true);

      document.getElementById("distance").value = "";
      // 연속 입력 편하면 이름 유지, 필요하면 아래 주석 해제
      // document.getElementById("name").value = "";
      // document.getElementById("team").value = "";
      document.getElementById("name").focus();
    }catch(e){
      setStatus("저장 실패(웹앱/배포 문제). Apps Script 재배포 확인", false);
    }
  }

  document.getElementById("lookupBtn").addEventListener("click", lookupTeam);
  document.getElementById("submitBtn").addEventListener("click", submit);

  // Enter 키 UX
  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const active = document.activeElement?.id;
    if(active === "name") lookupTeam();
    else if(active === "distance") submit();
  });
</script>
</body>
</html>
