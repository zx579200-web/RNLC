<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>RNLC 2월 팀 대항전</title>
  <style>
    :root{ --b:#111; --muted:#666; --card:#fcfcfc; --line:#eee; --radius:16px; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,"Noto Sans KR",sans-serif; background:#fff; color:#111; }
    .wrap{ width:min(760px, 92vw); margin:0 auto; padding:18px 0 44px; }
    h1{ margin:14px 0 18px; text-align:center; font-weight:900; font-size:34px; letter-spacing:0.02em; }

    .card{ border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:14px; }
    .fieldGroup{ margin:12px 0; }
    .label{ display:block; font-size:14px; margin:0 0 8px; font-weight:900; }
    .input{ width:100%; height:56px; border:3px solid var(--b); border-radius:14px; padding:10px 14px; font-size:18px; outline:none; }
    .row{ display:flex; gap:10px; align-items:center; }
    .grow{ flex:1; }
    .btn{ width:100%; height:56px; border:2px solid var(--b); border-radius:14px; background:#fff; font-size:18px; font-weight:900; cursor:pointer; }
    .btn.small{ width:120px; font-size:16px; height:56px; }

    .unitWrap{ position:relative; }
    .unit{ position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:16px; font-weight:900; }
    .input.unitPad{ padding-right:58px; }

    .status{ margin-top:10px; font-size:13px; color:var(--muted); min-height:18px; text-align:right; }

    .section{ margin-top:16px; }
    .sectionHead{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:0 0 10px; }
    .sectionHead h2{ margin:0; font-size:16px; font-weight:900; }
    .hint{ color:var(--muted); font-size:12px; }

    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .miniCard{ border:1px solid var(--line); border-radius:14px; background:var(--card); padding:12px; }
    .big{ font-size:22px; font-weight:1000; letter-spacing:0.01em; }
    .mono{ font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; }

    .rankList{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
    .rankRow{ display:grid; grid-template-columns:44px 1fr 92px; gap:10px; padding:12px; border-bottom:1px solid var(--line); align-items:center; font-size:14px; }
    .rankRow:last-child{ border-bottom:none; }
    .pill{ display:inline-block; border:1px solid #ddd; border-radius:999px; padding:3px 8px; font-size:12px; margin-left:8px; color:#333; }
    .right{ text-align:right; }

    .links{ margin-top:16px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; }
    a{ color:#111; }

    /* popup */
    .toastMask{ position:fixed; inset:0; background:rgba(0,0,0,0.25); display:none; align-items:center; justify-content:center; padding:18px; z-index:9999; }
    .toast{ width:min(420px, 92vw); background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px 16px 14px; box-shadow:0 12px 30px rgba(0,0,0,0.12); text-align:center; }
    .toastTitle{ font-size:18px; font-weight:1000; margin:4px 0 8px; }
    .toastBody{ font-size:14px; color:#333; margin:0 0 12px; white-space:pre-line; }
    .toastBtn{ width:100%; height:48px; border:2px solid var(--b); border-radius:14px; background:#fff; font-weight:900; cursor:pointer; }

    /* modal */
    .modalMask{ position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; align-items:flex-end; justify-content:center; z-index:9998; }
    .modal{ width:min(760px, 100vw); height:min(82vh, 720px); background:#fff; border-radius:18px 18px 0 0; overflow:hidden; border:1px solid var(--line); }
    .modalTop{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); font-weight:900; }
    .closeBtn{ border:1px solid #ddd; background:#fff; border-radius:12px; padding:8px 10px; font-weight:900; cursor:pointer; }
    .modal iframe{ width:100%; height:calc(100% - 48px); border:0; }

    @media (min-width: 900px){
      .wrap{ width:min(900px, 92vw); }
      h1{ font-size:44px; }
      .grid2{ grid-template-columns: repeat(4, 1fr); }
      .modalMask{ align-items:center; }
      .modal{ border-radius:18px; height:min(80vh, 760px); }
    }
  </style>
</head>

<body>
<div class="wrap">
  <h1>RNLC 2월 팀 대항전</h1>

  <div class="card">
    <div class="fieldGroup">
      <label class="label">이름</label>
      <div class="row">
        <input id="name" class="input grow" autocomplete="off" placeholder="이름 입력"/>
        <button id="lookupBtn" class="btn small" type="button">입력</button>
      </div>
      <div class="hint" style="margin-top:6px;">* 이름 입력 후 [입력] 버튼을 눌러 팀을 확인하세요.</div>
    </div>

    <div class="fieldGroup">
      <label class="label">팀</label>
      <input id="team" class="input" readonly placeholder="이름 입력 후 자동 표시"/>
    </div>

    <div class="fieldGroup">
      <label class="label">거리입력</label>
      <div class="unitWrap">
        <input id="distance" class="input unitPad" inputmode="decimal" placeholder="숫자만 입력"/>
        <div class="unit">km</div>
      </div>
      <div class="hint" style="margin-top:6px;">* 인증(사진 업로드) 성공 시에만 기록이 저장됩니다.</div>
    </div>

    <div class="fieldGroup">
      <button id="certBtn" class="btn" type="button">인증</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <div class="section">
    <div class="sectionHead">
      <h2>누계 현황</h2>
      <div class="hint" id="sumHint">불러오는 중...</div>
    </div>

    <div class="grid2">
      <div class="miniCard">
        <div class="hint">내 누계</div>
        <div class="big mono" id="myTotal">-</div>
      </div>
      <div class="miniCard">
        <div class="hint">내 팀</div>
        <div class="big mono" id="myTeam">-</div>
      </div>
      <div class="miniCard">
        <div class="hint">팀 1~4위</div>
        <div class="big mono" id="teamRankLine">-</div>
      </div>
      <div class="miniCard">
        <div class="hint">현재 1위 팀 누계</div>
        <div class="big mono" id="bestTeamTotal">-</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sectionHead">
      <h2>개인 TOP 10</h2>
      <div class="hint">entries 기준 자동 집계</div>
    </div>
    <div class="rankList" id="top10Box"></div>
  </div>

  <div class="links">
    <a href="./admin.html">DB(관리자)</a>
    <span class="hint">PATCH</span>
  </div>
</div>

<div class="toastMask" id="toastMask">
  <div class="toast">
    <div class="toastTitle" id="toastTitle">완료되었습니다</div>
    <div class="toastBody" id="toastBody"></div>
    <button class="toastBtn" id="toastBtn">확인</button>
  </div>
</div>

<div class="modalMask" id="modalMask">
  <div class="modal">
    <div class="modalTop">
      <div>인증 (사진 업로드)</div>
      <button class="closeBtn" id="closeModal">닫기</button>
    </div>
    <iframe id="proofFrame" title="proof uploader"></iframe>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWKsaTaqK5dtACbEbLQsEOB9EyTKfsIL3pplpjxt03buRW5wJ8ZylrvESr0mbC4q52/exec";

  function parseKm(v){
    const n = Number(String(v).trim().replace(",", "."));
    return Number.isFinite(n) ? n : NaN;
  }
  function fmtKm(n){
    const x = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    return x.toLocaleString("ko-KR", {maximumFractionDigits:2}) + " km";
  }
  function escapeHtml(s){
    return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }

  // JSONP
  function apiJsonp(params){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.callback = cb;
      const url = new URL(SCRIPT_URL);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
      const script = document.createElement("script");
      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      script.src = url.toString();
      document.body.appendChild(script);
      function cleanup(){
        try{ delete window[cb]; }catch(e){}
        script.remove();
      }
    });
  }

  // popup
  function showPopup(title, body){
    document.getElementById("toastTitle").textContent = title || "완료되었습니다";
    document.getElementById("toastBody").textContent = body || "";
    document.getElementById("toastMask").style.display = "flex";
  }
  function hidePopup(){ document.getElementById("toastMask").style.display = "none"; }
  document.getElementById("toastBtn").addEventListener("click", hidePopup);
  document.getElementById("toastMask").addEventListener("click", (e)=>{ if(e.target.id==="toastMask") hidePopup(); });

  // modal
  function closeProofModal(){
    document.getElementById("modalMask").style.display = "none";
    document.getElementById("proofFrame").src = "about:blank";
  }
  document.getElementById("closeModal").addEventListener("click", closeProofModal);
  document.getElementById("modalMask").addEventListener("click", (e)=>{ if(e.target.id==="modalMask") closeProofModal(); });

  function openProofModal(){
    const name = document.getElementById("name").value.trim();
    const team = document.getElementById("team").value.trim();
    const distRaw = document.getElementById("distance").value.trim();
    const km = parseKm(distRaw);

    if(!name) return showPopup("확인", "이름을 입력하세요.");
    if(!team) return showPopup("확인", "[입력] 버튼으로 팀을 먼저 확인하세요.");
    if(!Number.isFinite(km) || km <= 0) return showPopup("확인", "거리(km)를 0보다 큰 숫자로 입력하세요.");

    // ✅ cache 방지용 ts 파라미터
    const url = `${SCRIPT_URL}?page=proof&name=${encodeURIComponent(name)}&distance=${encodeURIComponent(distRaw)}&t=${Date.now()}`;
    document.getElementById("proofFrame").src = url;
    document.getElementById("modalMask").style.display = "flex";
  }
  document.getElementById("certBtn").addEventListener("click", openProofModal);

  // iframe -> 부모
  window.addEventListener("message", async (ev) => {
    const d = ev.data || {};
    if(d.type !== "proofUploaded") return;

    if(!d.ok){
      showPopup("오류", "인증 업로드 실패");
      return;
    }

    closeProofModal();

    const res = d.result || {};
    const base = `${res.date || ""}\n${res.name || ""} / ${res.team || ""}팀 / ${res.distance || ""}km\n인증 및 기록 저장 완료`;
    const msg = (res.counted === false)
      ? base + `\n※ 200km 초과로 누계/랭킹 집계 제외`
      : base;

    showPopup("완료되었습니다", msg);

    // 갱신
    await Promise.all([refreshLeaderboard(), refreshMyTotal()]);
    document.getElementById("distance").value = "";
  });

  async function refreshMyTotal(){
    const name = document.getElementById("name").value.trim();
    if(!name){
      document.getElementById("myTotal").textContent = "-";
      document.getElementById("myTeam").textContent = "-";
      return;
    }
    const out = await apiJsonp({ action:"personTotal", name });
    if(!out.ok) return;
    document.getElementById("myTotal").textContent = fmtKm(out.total || 0);
    document.getElementById("myTeam").textContent = out.team || "-";
  }

  async function refreshLeaderboard(){
    const hint = document.getElementById("sumHint");
    hint.textContent = "불러오는 중...";
    const out = await apiJsonp({ action:"leaderboard" });
    if(!out.ok){
      hint.textContent = "랭킹 불러오기 실패";
      return;
    }

    const ranks = out.teamRanks || [];
    document.getElementById("teamRankLine").textContent =
      ranks.map((x,i)=> `${i+1}위 ${x.team}`).join(" / ") || "-";
    document.getElementById("bestTeamTotal").textContent =
      ranks[0] ? `${ranks[0].team} : ${fmtKm(ranks[0].total)}` : "-";

    const top10 = out.top10 || [];
    const box = document.getElementById("top10Box");
    box.innerHTML = top10.length
      ? top10.map((p,i)=> `
        <div class="rankRow">
          <div class="mono">${i+1}</div>
          <div>${escapeHtml(p.name)} <span class="pill">${escapeHtml(p.team || '-')}팀</span></div>
          <div class="right mono">${fmtKm(p.total)}</div>
        </div>
      `).join("")
      : `<div class="rankRow"><div class="mono">-</div><div>데이터 없음</div><div class="right mono">-</div></div>`;

    const now = new Date();
    hint.textContent = `업데이트 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  }

  async function lookupTeam(){
    const name = document.getElementById("name").value.trim();
    if(!name) return showPopup("확인", "이름을 입력하세요.");

    const out = await apiJsonp({ action:"lookupTeam", name });
    if(!out.ok) return showPopup("확인", "DB에 없는 이름입니다. (DB 시트 확인)");

    document.getElementById("team").value = out.team;
    await refreshMyTotal();
    document.getElementById("distance").focus();
  }
  document.getElementById("lookupBtn").addEventListener("click", lookupTeam);

  // Enter UX
  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const id = document.activeElement?.id;
    if(id === "name") lookupTeam();
    else if(id === "distance") openProofModal();
  });

  refreshLeaderboard();
</script>
</body>
</html>
