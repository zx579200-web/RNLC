<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>RNLC 개인전</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:40px auto}
input,button{padding:10px;font-size:16px}
.card{border:1px solid #ddd;padding:16px;margin-top:20px}
.rankRow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>

<h2>RNLC 개인전</h2>

<div>
<input id="name" placeholder="이름"/>
<button onclick="refresh()">확인</button>
</div>

<div style="margin-top:10px;">
<input id="distance" placeholder="거리(km)"/>
<button onclick="submit()">입력</button>
</div>

<div class="card">
<h3>내 누계</h3>
<div id="myTotal">-</div>
</div>

<div class="card">
<h3>TOP 10</h3>
<div id="top10"></div>
</div>

<div class="card">
<h3>최근 기록</h3>
<div id="recent"></div>
</div>

<script>
const SCRIPT_URL="여기에_웹앱_exec_URL";

function api(params){
  return new Promise((res,rej)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    params.callback=cb;
    const url=new URL(SCRIPT_URL);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
    const s=document.createElement("script");
    window[cb]=(d)=>{delete window[cb];s.remove();res(d)};
    s.onerror=()=>rej();
    s.src=url;
    document.body.appendChild(s);
  });
}

async function submit(){
  const name=document.getElementById("name").value.trim();
  const distance=document.getElementById("distance").value.trim();
  const out=await api({action:"submit",name,distance});
  if(!out.ok) return alert(out.error);
  document.getElementById("distance").value="";
  refresh();
}

async function refresh(){
  const name=document.getElementById("name").value.trim();
  if(name){
    const t=await api({action:"personTotal",name});
    if(t.ok) document.getElementById("myTotal").innerText=t.total+" km";
  }

  const lb=await api({action:"leaderboard"});
  if(lb.ok){
    document.getElementById("top10").innerHTML=
      lb.ranked.map((r,i)=>`<div class="rankRow"><span>${i+1}. ${r.name}</span><span>${r.total} km</span></div>`).join("");
  }

  const rc=await api({action:"recent",limit:10});
  if(rc.ok){
    document.getElementById("recent").innerHTML=
      rc.rows.map(r=>`<div class="rankRow"><span>${r.name}</span><span>${r.effective} km</span></div>`).join("");
  }
}
</script>
</body>
</html>
