<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>RNLC 2월 팀 대항전</title>
  <style>
    :root{
      --b:#111; --muted:#666; --card:#fcfcfc; --line:#eee;
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,"Noto Sans KR",sans-serif;
      background:#fff;
      color:#111;
    }
    .wrap{
      width:min(760px, 92vw);
      margin:0 auto;
      padding:18px 0 44px;
    }
    h1{
      margin:14px 0 18px;
      text-align:center;
      font-weight:900;
      font-size:34px;
      letter-spacing:0.02em;
    }

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:#fff;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,0.04);
    }
    .cardPad{ padding:16px; }

    .row{
      display:flex;
      gap:10px;
      align-items:flex-end;
      flex-wrap:wrap;
    }
    label{
      display:block;
      font-weight:800;
      font-size:13px;
      margin:0 0 6px;
      color:var(--muted);
    }
    input{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 12px;
      font-size:16px;
      outline:none;
    }
    input:focus{ border-color:#cfcfcf; }
    .field{ flex:1; min-width:220px; }
    .fieldSmall{ width:140px; min-width:140px; }

    .btn{
      border:none;
      border-radius:12px;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
      font-size:15px;
      background:#111;
      color:#fff;
      min-width:120px;
    }
    .btnSecondary{
      background:#f3f3f3;
      color:#111;
    }
    .btn:disabled{
      opacity:0.55;
      cursor:not-allowed;
    }

    .hint{
      color:var(--muted);
      font-size:13px;
      white-space:pre-line;
    }
    .pill{
      display:inline-block;
      padding:3px 8px;
      border-radius:999px;
      background:#f1f1f1;
      font-size:12px;
      font-weight:800;
      margin-left:6px;
      vertical-align:middle;
    }

    .section{
      margin-top:14px;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
    .sectionHead{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:baseline;
      margin:0 0 10px;
    }
    .sectionHead h2{
      margin:0;
      font-size:18px;
      font-weight:900;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    @media(max-width:520px){
      .grid2{ grid-template-columns:1fr; }
    }

    .miniCard{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:var(--card);
    }
    .big{
      font-size:22px;
      font-weight:900;
      margin-top:6px;
    }
    .mono{
      font-variant-numeric:tabular-nums;
      font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .rankList{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
    }
    .rankRow{
      display:grid;
      grid-template-columns:40px 1fr 120px;
      gap:10px;
      align-items:center;
      padding:10px 12px;
      border-top:1px solid var(--line);
      font-size:15px;
    }
    .rankRow:first-child{ border-top:none; }
    .right{ text-align:right; }

    .bottomBar{
      display:flex;
      justify-content:flex-end;
      margin-top:14px;
    }
    .adminBtn{
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      color:#111;
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 10px;
      background:#fff;
    }

    .toastMask{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.35);
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
    }
    .toast{
      background:#fff;
      border-radius:18px;
      width:min(420px, 92vw);
      padding:16px;
      border:1px solid var(--line);
      box-shadow:0 10px 26px rgba(0,0,0,0.14);
    }
    .toastTitle{
      font-weight:900;
      font-size:18px;
      margin:0 0 8px;
    }
    .toastBody{
      margin:0 0 14px;
      color:#222;
      white-space:pre-line;
      line-height:1.35;
      font-size:14px;
    }
    .toastBtnRow{
      display:flex;
      justify-content:flex-end;
    }

    /* ===== 추가: 탭/필터 UI ===== */
    .tabBar{
      display:flex;
      gap:10px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--card);
      margin-top:4px;
    }
    .tabBtn{
      flex:1;
      height:46px;
      border:2px solid var(--b);
      border-radius:12px;
      background:#fff;
      font-weight:1000;
      cursor:pointer;
      font-size:14px;
    }
    .tabBtn.active{
      background:#111;
      color:#fff;
    }
    .tabPanel{ display:none; margin-top:10px; }
    .tabPanel.active{ display:block; }

    .filterRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:10px 0 10px;
    }
    .filterBtn{
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 10px;
      background:#fff;
      font-weight:900;
      cursor:pointer;
      font-size:12px;
    }
    .filterBtn.active{
      border-color:#111;
      background:#111;
      color:#fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>RNLC 2월 팀 대항전</h1>

    <div class="card">
      <div class="cardPad">
        <div class="row">
          <div class="field">
            <label>이름</label>
            <input id="name" placeholder="예) 홍길동"/>
          </div>
          <div class="fieldSmall">
            <label>팀</label>
            <input id="team" placeholder="R/N/L/C" disabled/>
          </div>
          <button class="btn btnSecondary" id="lookupBtn">입력</button>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div class="field">
            <label>거리(km)</label>
            <input id="distance" placeholder="예) 5.2"/>
            <div class="hint" style="margin-top:6px;">※ 200km 초과 기록은 저장되지만 누계/랭킹 집계에서 제외됩니다.</div>
          </div>
          <button class="btn" id="submitBtn">입력 완료</button>
        </div>

        <div class="section">
          <div class="sectionHead">
            <h2>누계 현황</h2>
            <div class="hint" id="sumHint">불러오는 중...</div>
          </div>

          <div class="grid2">
            <div class="miniCard">
              <div class="hint">내 누계</div>
              <div class="big mono" id="myTotal">-</div>
            </div>
            <div class="miniCard">
              <div class="hint">내 팀</div>
              <div class="big mono" id="myTeam">-</div>
            </div>
            <div class="miniCard">
              <div class="hint">팀 순위</div>
              <div class="big mono" id="teamRankLine">-</div>
            </div>
            <div class="miniCard">
              <div class="hint">현재 1위 팀 누계</div>
              <div class="big mono" id="bestTeamTotal">-</div>
            </div>
          </div>
        </div>

        <!-- ===== 기록 탭(개인 TOP10 / 최근 인증기록) ===== -->
        <div class="section">
          <div class="tabBar" role="tablist" aria-label="기록 탭">
            <button class="tabBtn active" id="tabTop10" type="button" aria-selected="true">개인 TOP10</button>
            <button class="tabBtn" id="tabRecent" type="button" aria-selected="false">최근 인증기록</button>
          </div>

          <!-- TOP10 -->
          <div class="tabPanel active" id="panelTop10" role="tabpanel">
            <div class="sectionHead">
              <h2>개인 TOP 10</h2>
              <div class="hint">entries 기준 자동 집계</div>
            </div>
            <div class="rankList" id="top10Box"></div>
          </div>

          <!-- Recent -->
          <div class="tabPanel" id="panelRecent" role="tabpanel">
            <div class="sectionHead">
              <h2>최근 인증 기록</h2>
              <div class="hint">최대 10개 표시</div>
            </div>

            <div class="filterRow" aria-label="최근 인증 기록 필터">
              <button class="filterBtn" id="fMyTeam" type="button">내 팀만</button>
              <button class="filterBtn" id="fMyName" type="button">내 이름만</button>
              <button class="filterBtn" id="fToday" type="button">오늘만</button>
              <button class="filterBtn" id="fReset" type="button">전체</button>
            </div>

            <div class="rankList" id="recentBox"></div>
          </div>
        </div>

        <div class="bottomBar">
          <a class="adminBtn" href="./admin.html">DB(관리자)</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toastMask" id="toastMask">
    <div class="toast">
      <div class="toastTitle" id="toastTitle">완료되었습니다</div>
      <div class="toastBody" id="toastBody"></div>
      <div class="toastBtnRow">
        <button class="btn btnSecondary" id="toastBtn">닫기</button>
      </div>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWKsaTaqK5dtACbEbLQsEOB9EyTKfsIL3pplpjxt03buRW5wJ8ZylrvESr0mbC4q52/exec";
  const COOLDOWN_SECONDS = 60;

  function parseKm(v){
    const n = Number(String(v).trim().replace(",", "."));
    return Number.isFinite(n) ? n : NaN;
  }
  function fmtKm(n){
    const x = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    return x.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + " km";
  }
  function escapeHtml(s){
    return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }

  function apiJsonp(params){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.callback = cb;

      const url = new URL(SCRIPT_URL);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

      const script = document.createElement("script");
      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      script.src = url.toString();
      document.body.appendChild(script);

      function cleanup(){
        try{ delete window[cb]; }catch(e){}
        script.remove();
      }
    });
  }

  function showPopup(title, body){
    document.getElementById("toastTitle").textContent = title || "완료되었습니다";
    document.getElementById("toastBody").textContent = body || "";
    document.getElementById("toastMask").style.display = "flex";
  }
  function hidePopup(){ document.getElementById("toastMask").style.display = "none"; }
  document.getElementById("toastBtn").addEventListener("click", hidePopup);
  document.getElementById("toastMask").addEventListener("click", (e)=>{ if(e.target.id==="toastMask") hidePopup(); });

  // ===== 버튼 쿨다운(프론트) =====
  let submitLockUntil = 0;
  let submitTimer = null;

  function unlockSubmitButton(){
    submitLockUntil = 0;
    clearInterval(submitTimer);
    const btn = document.getElementById("submitBtn");
    btn.disabled = false;
    btn.textContent = "입력 완료";
  }

  function lockSubmitButton(seconds){
    const btn = document.getElementById("submitBtn");
    const baseText = "입력 완료";
    submitLockUntil = Date.now() + seconds*1000;

    btn.disabled = true;

    clearInterval(submitTimer);
    submitTimer = setInterval(()=>{
      const left = Math.ceil((submitLockUntil - Date.now())/1000);
      if(left <= 0){
        clearInterval(submitTimer);
        btn.disabled = false;
        btn.textContent = baseText;
        return;
      }
      btn.textContent = `${baseText} (${left}s)`;
    }, 250);
  }

  async function lookupTeam(){
    const name = document.getElementById("name").value.trim();
    if(!name) return showPopup("확인", "이름을 입력하세요.");

    const out = await apiJsonp({ action:"lookupTeam", name });
    if(!out.ok) return showPopup("확인", "DB에 없는 이름입니다. (DB 시트 확인)");

    document.getElementById("team").value = out.team;
    await Promise.all([refreshMyTotal(), refreshRecent()]);
    document.getElementById("distance").focus();
  }

  async function submit(){
    // 프론트 잠금 상태면 무시
    if(Date.now() < submitLockUntil) return;

    const name = document.getElementById("name").value.trim();
    const team = document.getElementById("team").value.trim();
    const distRaw = document.getElementById("distance").value.trim();
    const km = parseKm(distRaw);

    if(!name) return showPopup("확인", "이름을 입력하세요.");
    if(!team) return showPopup("확인", "[입력] 버튼으로 팀을 먼저 확인하세요.");
    if(!Number.isFinite(km) || km <= 0) return showPopup("확인", "거리(km)를 0보다 큰 숫자로 입력하세요.");

    // ✅ 눌렀으면 즉시 60초 잠금(중복 방지)
    lockSubmitButton(COOLDOWN_SECONDS);

    let out;
    try{
      out = await apiJsonp({ action:"submit", name, distance: distRaw });
    }catch(e){
      unlockSubmitButton();
      return showPopup("오류", "네트워크 오류로 저장 실패. 다시 시도해 주세요.");
    }

    if(!out.ok){
      // 서버 에러면 잠금 해제(사용자 재시도 가능)
      unlockSubmitButton();

      // 서버 쿨다운 메시지 가독성 처리
      if(String(out.error || "").includes("cooldown")){
        return showPopup("잠시만요", `중복 방지를 위해 ${COOLDOWN_SECONDS}초 간 재입력이 제한됩니다.\n잠시 후 다시 시도해 주세요.`);
      }
      return showPopup("오류", out.error || "저장 실패");
    }

    const base = `${out.date}\n${out.name} / ${out.team}팀 / ${out.distance}km\n기록 저장 완료`;
    const msg = (out.counted === false) ? base + `\n※ 200km 초과로 누계/랭킹 집계 제외` : base;
    showPopup("완료되었습니다", msg);

    document.getElementById("distance").value = "";
    await Promise.all([refreshLeaderboard(), refreshMyTotal(), refreshRecent()]);
  }

  async function refreshMyTotal(){
    const name = document.getElementById("name").value.trim();
    if(!name){
      document.getElementById("myTotal").textContent = "-";
      document.getElementById("myTeam").textContent = "-";
      return;
    }
    const out = await apiJsonp({ action:"personTotal", name });
    if(!out.ok) return;
    document.getElementById("myTotal").textContent = fmtKm(out.total || 0);
    document.getElementById("myTeam").textContent = out.team || "-";
  }

  async function refreshLeaderboard(){
    const hint = document.getElementById("sumHint");
    hint.textContent = "불러오는 중...";

    const out = await apiJsonp({ action:"leaderboard" });
    if(!out.ok){
      hint.textContent = "랭킹 불러오기 실패";
      return;
    }

    const ranks = out.teamRanks || [];
    document.getElementById("teamRankLine").textContent =
      ranks.map((x,i)=> `${i+1}위 ${x.team}`).join(" / ") || "-";
    document.getElementById("bestTeamTotal").textContent =
      ranks[0] ? `${ranks[0].team} : ${fmtKm(ranks[0].total)}` : "-";

    const top10 = out.top10 || [];
    const box = document.getElementById("top10Box");
    box.innerHTML = top10.length
      ? top10.map((p,i)=> `
        <div class="rankRow">
          <div class="mono">${i+1}</div>
          <div>${escapeHtml(p.name)} <span class="pill">${escapeHtml(p.team || '-')}팀</span></div>
          <div class="right mono">${fmtKm(p.total)}</div>
        </div>
      `).join("")
      : `<div class="rankRow"><div class="mono">-</div><div>데이터 없음</div><div class="right mono">-</div></div>`;

    const now = new Date();
    hint.textContent = `업데이트 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  }

  // ===== 추가: 최근 인증 기록(탭 + 필터) =====
  let recentRows = [];
  const recentFilter = { myTeam:false, myName:false, today:false };

  function ymdLocal(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${dd}`;
  }

  function setTab(tab){
    const isTop = (tab === "top10");
    document.getElementById("tabTop10").classList.toggle("active", isTop);
    document.getElementById("tabRecent").classList.toggle("active", !isTop);
    document.getElementById("tabTop10").setAttribute("aria-selected", isTop ? "true" : "false");
    document.getElementById("tabRecent").setAttribute("aria-selected", isTop ? "false" : "true");

    document.getElementById("panelTop10").classList.toggle("active", isTop);
    document.getElementById("panelRecent").classList.toggle("active", !isTop);

    if(!isTop) renderRecent();
  }

  function syncFilterButtons(){
    document.getElementById("fMyTeam").classList.toggle("active", recentFilter.myTeam);
    document.getElementById("fMyName").classList.toggle("active", recentFilter.myName);
    document.getElementById("fToday").classList.toggle("active", recentFilter.today);
  }

  function toggleFilter(key){
    recentFilter[key] = !recentFilter[key];
    syncFilterButtons();
    renderRecent();
  }

  function resetFilters(){
    recentFilter.myTeam = false;
    recentFilter.myName = false;
    recentFilter.today = false;
    syncFilterButtons();
    renderRecent();
  }

  function fmtRecentRow(r){
    const date = escapeHtml(String(r.date || "").slice(0,16)); // yyyy-MM-dd HH:mm
    const name = escapeHtml(r.name || "");
    const team = escapeHtml(r.team || "-");
    const km = fmtKm(r.distance || 0);
    const extra = (r.counted === false) ? `<span class="pill">집계 제외</span>` : "";
    return `
      <div class="rankRow" style="grid-template-columns:140px 1fr 120px;">
        <div class="mono">${date}</div>
        <div>${name} <span class="pill">${team}팀</span> ${extra}</div>
        <div class="right mono">${km}</div>
      </div>
    `;
  }

  function applyRecentFilters(rows){
    const nameNow = document.getElementById("name").value.trim();
    const teamNow = document.getElementById("team").value.trim();
    const todayStr = ymdLocal(new Date());

    return rows.filter(r => {
      if(recentFilter.myTeam && teamNow && String(r.team||"") !== teamNow) return false;
      if(recentFilter.myName && nameNow && String(r.name||"") !== nameNow) return false;
      if(recentFilter.today){
        const d = String(r.date||"").slice(0,10);
        if(d !== todayStr) return false;
      }
      return true;
    });
  }

  async function refreshRecent(){
    const box = document.getElementById("recentBox");
    if(!box) return;

    let out;
    try{
      // 필터 정확도 위해 100개까지 가져오고, 화면에는 최대 10개만 표시
      out = await apiJsonp({ action:"recentEntries", limit:"100" });
    }catch(e){
      box.innerHTML = `<div class="rankRow"><div class="mono">-</div><div>최근 기록 불러오기 실패</div><div class="right mono">-</div></div>`;
      return;
    }

    if(!out.ok){
      box.innerHTML = `<div class="rankRow"><div class="mono">-</div><div>최근 기록 불러오기 실패</div><div class="right mono">-</div></div>`;
      return;
    }

    recentRows = out.rows || [];
    renderRecent();
  }

  function renderRecent(){
    const box = document.getElementById("recentBox");
    if(!box) return;

    const filtered = applyRecentFilters(recentRows);
    const rows = filtered.slice(0, 10);

    box.innerHTML = rows.length
      ? rows.map(fmtRecentRow).join("")
      : `<div class="rankRow"><div class="mono">-</div><div>표시할 기록이 없습니다.</div><div class="right mono">-</div></div>`;
  }

  function initTabsAndFilters(){
    const t1 = document.getElementById("tabTop10");
    const t2 = document.getElementById("tabRecent");
    if(!t1 || !t2) return;

    t1.addEventListener("click", ()=> setTab("top10"));
    t2.addEventListener("click", ()=> setTab("recent"));

    document.getElementById("fMyTeam").addEventListener("click", ()=> toggleFilter("myTeam"));
    document.getElementById("fMyName").addEventListener("click", ()=> toggleFilter("myName"));
    document.getElementById("fToday").addEventListener("click", ()=> toggleFilter("today"));
    document.getElementById("fReset").addEventListener("click", resetFilters);

    syncFilterButtons();
  }

  document.getElementById("lookupBtn").addEventListener("click", lookupTeam);
  document.getElementById("submitBtn").addEventListener("click", submit);

  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const id = document.activeElement?.id;
    if(id === "name") lookupTeam();
    else if(id === "distance") submit();
  });

  // 초기 실행
  initTabsAndFilters();
  refreshLeaderboard();
  refreshRecent();
</script>
</body>
</html>
