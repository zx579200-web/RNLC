<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>RNLC 관리자</title>
  <style>
    :root{ --b:#111; --muted:#666; --line:#eee; --radius:16px; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,"Noto Sans KR",sans-serif; background:#fff; color:#111; }
    .wrap{ width:min(980px, 92vw); margin:0 auto; padding:18px 0 44px; }
    h1{ margin:14px 0 18px; text-align:center; font-weight:900; font-size:28px; }
    .card{ border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:14px; }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .input{ height:48px; border:2px solid var(--b); border-radius:12px; padding:10px 12px; font-size:15px; outline:none; }
    .btn{ height:48px; border:2px solid var(--b); border-radius:12px; background:#fff; font-size:15px; font-weight:900; cursor:pointer; padding:0 14px; }
    .btn.danger{ border-color:#c00; color:#c00; }
    .hint{ font-size:12px; color:var(--muted); margin-top:8px; white-space:pre-line; }
    .section{ margin-top:14px; }
    h2{ margin:12px 0 10px; font-size:16px; font-weight:900; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th, td{ border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:middle; }
    th{ font-weight:900; background:#fafafa; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .right{ text-align:right; }
    .pill{ display:inline-block; padding:2px 8px; border:1px solid #ddd; border-radius:999px; font-size:12px; }

    .toastMask{ position:fixed; inset:0; background:rgba(0,0,0,0.25); display:none; align-items:center; justify-content:center; padding:18px; z-index:9999; }
    .toast{ width:min(520px, 92vw); background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px 16px 14px; box-shadow:0 12px 30px rgba(0,0,0,0.12); }
    .toastTitle{ font-size:18px; font-weight:1000; margin:4px 0 8px; }
    .toastBody{ font-size:14px; color:#333; margin:0 0 12px; white-space:pre-line; }
    .toastBtn{ width:100%; height:48px; border:2px solid var(--b); border-radius:14px; background:#fff; font-weight:900; cursor:pointer; }
  </style>
</head>

<body>
<div class="wrap">
  <h1>RNLC 관리자</h1>

  <div class="card">
    <div class="row">
      <input id="pass" class="input" style="width:220px" placeholder="관리자 비밀번호(pass)"/>
      <button class="btn" id="btnLoad">불러오기</button>
      <button class="btn" id="btnRebuild">캐시 재계산</button>
      <button class="btn danger" id="btnMonthlyReset">월간 리셋(아카이브)</button>
      <a class="btn" href="./index.html" style="text-decoration:none; color:#111; display:inline-flex; align-items:center;">← 메인</a>
    </div>
    <div class="hint" id="statusHint">
      * 비밀번호는 스프레드시트의 <b>admin</b> 시트 <b>A1</b> 값입니다.
    </div>
  </div>

  <div class="section card">
    <h2>사전등록자(DB)</h2>
    <div class="row" style="margin-bottom:10px;">
      <input id="pName" class="input" style="width:240px" placeholder="등록/삭제할 이름"/>
      <button class="btn" id="btnAdd">등록</button>
      <button class="btn danger" id="btnRemove">삭제(A열)</button>
    </div>
    <div class="hint">
      * DB 시트 <b>A열(A2~)</b>에 이름을 넣으면 사전등록자입니다.
      * 기존 RNLC 팀명단(B/D/F/H)에 있던 이름도 등록자로 인정됩니다(호환).
    </div>
    <div id="rosterBox" class="hint">불러오기 전</div>
  </div>

  <div class="section card">
    <h2 style="margin:0 0 10px;">최근 기록(entries, 활성 월)</h2>
    <div class="hint" style="margin-bottom:10px;">* 메인에서 보이는 recentEntries와 동일하게 “활성 월” 기준으로 최근 200건을 가져옵니다.</div>

    <div style="overflow:auto;">
      <table>
        <thead>
          <tr>
            <th class="mono">ts</th>
            <th>date</th>
            <th>name</th>
            <th class="right">km</th>
            <th class="right">eff</th>
          </tr>
        </thead>
        <tbody id="entriesBody">
          <tr><td colspan="5" class="hint">불러오기 전</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toastMask" id="toastMask">
  <div class="toast">
    <div class="toastTitle" id="toastTitle">안내</div>
    <div class="toastBody" id="toastBody"></div>
    <button class="toastBtn" id="toastBtn">확인</button>
  </div>
</div>

<script>
  // ✅ 네 웹앱 /exec URL (고정)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWKsaTaqK5dtACbEbLQsEOB9EyTKfsIL3pplpjxt03buRW5wJ8ZylrvESr0mbC4q52/exec";

  function showPopup(title, body){
    document.getElementById("toastTitle").textContent = title || "안내";
    document.getElementById("toastBody").textContent = body || "";
    document.getElementById("toastMask").style.display = "flex";
  }
  function hidePopup(){ document.getElementById("toastMask").style.display = "none"; }
  document.getElementById("toastBtn").addEventListener("click", hidePopup);
  document.getElementById("toastMask").addEventListener("click", (e)=>{ if(e.target.id==="toastMask") hidePopup(); });

  function apiJsonp(params, timeoutMs = 12000){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.callback = cb;

      const url = new URL(SCRIPT_URL);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

      const script = document.createElement("script");
      let done = false;

      const timer = setTimeout(() => {
        if(done) return;
        done = true;
        cleanup();
        reject(new Error("JSONP timeout"));
      }, timeoutMs);

      window[cb] = (data) => {
        if(done) return;
        done = true;
        clearTimeout(timer);
        cleanup();
        resolve(data);
      };

      script.onerror = () => {
        if(done) return;
        done = true;
        clearTimeout(timer);
        cleanup();
        reject(new Error("JSONP load error"));
      };

      script.src = url.toString();
      document.body.appendChild(script);

      function cleanup(){
        try{ delete window[cb]; }catch(e){}
        script.remove();
      }
    });
  }

  function passValue(){ return document.getElementById("pass").value.trim(); }
  function pName(){ return document.getElementById("pName").value.trim(); }

  function renderRoster(roster){
    const list = (roster || []).map(x=> String(x.name||'').trim()).filter(Boolean);
    const html = `
      <div><b>등록자</b> (${list.length}명)</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        ${list.map(n=>`<span class="pill">${n}</span>`).join("") || "<span class='hint'>-</span>"}
      </div>
    `;
    document.getElementById("rosterBox").innerHTML = html;
  }

  function renderEntries(rows){
    const body = document.getElementById("entriesBody");
    if(!rows || !rows.length){
      body.innerHTML = `<tr><td colspan="5" class="hint">데이터 없음</td></tr>`;
      return;
    }
    const list = rows.slice(0, 200);
    body.innerHTML = list.map(r=>`
      <tr>
        <td class="mono">${r.ts||""}</td>
        <td>${String(r.date||"").slice(0,16)}</td>
        <td>${r.name||""}</td>
        <td class="right mono">${(r.distance||0).toString()}</td>
        <td class="right mono">${(r.effectiveDistance===null || r.effectiveDistance===undefined) ? "" : String(r.effectiveDistance)}</td>
      </tr>
    `).join("");
  }

  async function loadStatus(){
    try{
      const out = await apiJsonp({ action:"status" });
      if(!out.ok) throw new Error(out.error || "status failed");
      document.getElementById("statusHint").textContent =
        `* 활성 월: ${out.activeMonth} / 아카이브 월 개수: ${(out.months||[]).length}`;
      return out;
    }catch(e){
      const testUrl = `${SCRIPT_URL}?action=status&callback=cb`;
      showPopup("오류", `status 불러오기 실패.\n\n아래 URL을 주소창에서 열면 cb({...}); 형태가 떠야 합니다.\n${testUrl}\n\n안 뜨면 배포 권한을 'Anyone'로 바꿔야 합니다.`);
      return null;
    }
  }

  async function loadAll(){
    const pass = passValue();
    if(!pass) return showPopup("확인", "관리자 비밀번호(pass)를 입력하세요.");

    const st = await loadStatus();
    if(!st) return;

    try{
      const [roster, entries] = await Promise.all([
        apiJsonp({ action:"roster", pass }),
        apiJsonp({ action:"recentEntries", monthKey: st.activeMonth, limit:"200" })
      ]);

      if(!roster.ok) return showPopup("오류", roster.error || "roster 실패");
      if(!entries.ok) return showPopup("오류", entries.error || "entries 실패");

      renderRoster(roster.roster);
      renderEntries(entries.rows || []);
      showPopup("완료", "관리자 데이터 불러오기 완료");
    }catch(err){
      showPopup("오류", String(err && err.message ? err.message : err));
    }
  }

  async function addP(){
    const pass = passValue();
    const name = pName();
    if(!pass) return showPopup("확인", "관리자 비밀번호(pass)를 입력하세요.");
    if(!name) return showPopup("확인", "이름을 입력하세요.");

    try{
      const out = await apiJsonp({ action:"addParticipant", pass, name });
      if(!out.ok) return showPopup("오류", out.error || "등록 실패");
      await loadAll();
    }catch(err){
      showPopup("오류", String(err && err.message ? err.message : err));
    }
  }

  async function removeP(){
    const pass = passValue();
    const name = pName();
    if(!pass) return showPopup("확인", "관리자 비밀번호(pass)를 입력하세요.");
    if(!name) return showPopup("확인", "이름을 입력하세요.");

    const ok = confirm(`DB(A열)에서 삭제할까요?\n이름: ${name}\n(기존 팀명단(B/D/F/H)은 건드리지 않습니다)`);
    if(!ok) return;

    try{
      const out = await apiJsonp({ action:"removeParticipant", pass, name });
      if(!out.ok) return showPopup("오류", out.error || "삭제 실패");
      await loadAll();
    }catch(err){
      showPopup("오류", String(err && err.message ? err.message : err));
    }
  }

  async function rebuildCache(){
    const pass = passValue();
    if(!pass) return showPopup("확인", "관리자 비밀번호(pass)를 입력하세요.");
    const ok = confirm("활성 월 캐시를 재계산할까요?");
    if(!ok) return;

    showPopup("진행중", "캐시 재계산 중...");

    try{
      const out = await apiJsonp({ action:"rebuildCache", pass });
      if(!out || !out.ok) return showPopup("오류", (out && out.error) ? out.error : "rebuildCache 실패");
      showPopup("완료", `캐시 재계산 완료\n월: ${out.monthKey}\n참가자: ${out.count}명`);
    }catch(err){
      showPopup("오류", String(err && err.message ? err.message : err));
    }
  }

  async function monthlyReset(){
    const pass = passValue();
    if(!pass) return showPopup("확인", "관리자 비밀번호(pass)를 입력하세요.");

    const ok = confirm("월간 리셋(아카이브)을 실행할까요?\n- 당월을 아카이브로 보관\n- 활성 월을 다음달로 전환\n(되돌리기 어려움)");
    if(!ok) return;

    showPopup("진행중", "월간 리셋(아카이브) 실행 중...");

    try{
      const out = await apiJsonp({ action:"monthlyReset", pass });
      if(!out || !out.ok) return showPopup("오류", (out && out.error) ? out.error : "monthlyReset 실패");

      showPopup("완료", `아카이브 완료: ${out.archivedMonth}\n새 활성 월: ${out.newActiveMonth}\n\n메인에서 월 선택으로 조회 가능합니다.`);
      await loadAll();
    }catch(err){
      showPopup("오류", String(err && err.message ? err.message : err));
    }
  }

  document.getElementById("btnLoad").addEventListener("click", loadAll);
  document.getElementById("btnRebuild").addEventListener("click", rebuildCache);
  document.getElementById("btnMonthlyReset").addEventListener("click", monthlyReset);
  document.getElementById("btnAdd").addEventListener("click", addP);
  document.getElementById("btnRemove").addEventListener("click", removeP);

  // 첫 화면에서 status만 미리 체크(권한/배포 확인)
  loadStatus();
</script>
</body>
</html>
