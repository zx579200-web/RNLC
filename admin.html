<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DB 관리자</title>
  <style>
    body{margin:0;font-family:system-ui,"Noto Sans KR",sans-serif;background:#fff;color:#111}
    .wrap{width:min(1200px,94vw);margin:0 auto;padding:28px 0 50px}
    h1{margin:10px 0 14px;font-size:26px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
    input{font-size:14px;padding:10px 12px;border:1px solid #ddd;border-radius:10px}
    button{font-size:14px;padding:10px 12px;border:1px solid #111;border-radius:10px;background:#fff;cursor:pointer}
    button.danger{border-color:#d33}
    table{width:100%;border-collapse:collapse;border:1px solid #eee;border-radius:12px;overflow:hidden}
    th,td{padding:10px;border-bottom:1px solid #eee;font-size:13px;white-space:nowrap}
    th{background:#f7f7f7;text-align:left;position:sticky;top:0}
    .tableWrap{max-height:70vh;overflow:auto}
    .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
    a{color:#111}
    .hint{color:#666;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between">
    <h1>DB 관리자</h1>
    <a href="./index.html">← 입력 화면</a>
  </div>

  <div class="row">
    <input id="pass" type="password" placeholder="관리자 비밀번호"/>
    <button id="loadBtn">불러오기</button>
    <button id="csvBtn">CSV 내보내기</button>
  </div>
  <div class="hint">수정: 이름/거리만 변경. 삭제: 해당 행 제거</div>

  <div id="status" class="hint" style="margin:10px 0"></div>

  <div class="tableWrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>name</th><th>team</th><th>date</th><th>distance</th><th>ts</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const https://script.google.com/macros/s/AKfycbzWKsaTaqK5dtACbEbLQsEOB9EyTKfsIL3pplpjxt03buRW5wJ8ZylrvESr0mbC4q52/exec = "여기에_AppsScript_웹앱_URL_붙여넣기"; // ★필수 변경

function setStatus(msg){ document.getElementById("status").textContent = msg || ""; }

async function api(params){
  const url = new URL(SCRIPT_URL);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { method:"GET" });
  return await res.json();
}

async function load(){
  const pass = document.getElementById("pass").value.trim();
  if(!pass) return setStatus("비밀번호를 입력하세요.");
  const out = await api({action:"list", pass});
  if(!out.ok) return setStatus("불러오기 실패: " + (out.error||""));
  render(out.rows || []);
  setStatus(`rows: ${(out.rows||[]).length}`);
}

function render(rows){
  const tb = document.getElementById("tbody");
  tb.innerHTML = rows.slice().sort((a,b)=>b.ts-a.ts).map((r,i)=>`
    <tr>
      <td class="mono">${i+1}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${r.team}</td>
      <td class="mono">${r.date}</td>
      <td class="mono">${r.distance}</td>
      <td class="mono">${r.ts}</td>
      <td>
        <button onclick="editRow(${r.ts})">수정</button>
        <button class="danger" onclick="delRow(${r.ts})">삭제</button>
      </td>
    </tr>
  `).join("") || `<tr><td colspan="7" class="hint">데이터 없음</td></tr>`;
}

function escapeHtml(str){
  return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

window.editRow = async (ts) => {
  const pass = document.getElementById("pass").value.trim();
  const name = prompt("이름");
  if(name === null) return;
  const distance = prompt("거리(km)");
  if(distance === null) return;
  const out = await api({action:"update", pass, ts, name:name.trim(), distance});
  if(!out.ok) return setStatus("수정 실패: " + (out.error||""));
  await load();
};

window.delRow = async (ts) => {
  const pass = document.getElementById("pass").value.trim();
  if(!confirm("삭제할까요?")) return;
  const out = await api({action:"delete", pass, ts});
  if(!out.ok) return setStatus("삭제 실패: " + (out.error||""));
  await load();
};

document.getElementById("loadBtn").addEventListener("click", load);

document.getElementById("csvBtn").addEventListener("click", async ()=>{
  const pass = document.getElementById("pass").value.trim();
  if(!pass) return setStatus("비밀번호를 입력하세요.");
  const out = await api({action:"list", pass});
  if(!out.ok) return setStatus("내보내기 실패: " + (out.error||""));
  const rows = out.rows || [];
  const header = ["ts","date","name","team","distance"];
  const csv = [header.join(",")].concat(rows.map(r =>
    [r.ts,r.date,r.name,r.team,r.distance].map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")
  )).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "RNLC_entries.csv"; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
