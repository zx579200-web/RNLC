<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>관리자</title>
</head>
<body>

<h2>RNLC 관리자</h2>

<input id="pass" placeholder="비밀번호"/>
<input id="month" placeholder="YYYY-MM"/>
<button onclick="setMonth()">월 변경</button>

<h3>기록</h3>
<div id="list"></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzpiaBXe7oz30B0Ys5V6TVndP16KPHf7OWSDABliwyFL310VgG95iPUr1ZxtHax7BI/exec";

function api(params){
  return new Promise((res,rej)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    params.callback=cb;
    const url=new URL(SCRIPT_URL);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
    const s=document.createElement("script");
    window[cb]=(d)=>{delete window[cb];s.remove();res(d)};
    s.onerror=()=>rej();
    s.src=url;
    document.body.appendChild(s);
  });
}

async function load(){
  const pass=document.getElementById("pass").value;
  const out=await api({action:"entriesList",pass});
  if(!out.ok) return alert(out.error);
  document.getElementById("list").innerHTML=
    out.rows.map(r=>`<div>${r.date} ${r.name} ${r.distance}km 
      <button onclick="del(${r.ts})">삭제</button></div>`).join("");
}

async function del(ts){
  const pass=document.getElementById("pass").value;
  await api({action:"deleteEntry",pass,ts});
  load();
}

async function setMonth(){
  const pass=document.getElementById("pass").value;
  const month=document.getElementById("month").value;
  const out=await api({action:"setMonth",pass,month});
  if(out.ok) alert("월 변경 완료");
}

</script>
</body>
</html>
