<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RNLC 관리자</title>
  <style>
    :root{ --b:#111; --muted:#666; --line:#eee; --radius:16px; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,"Noto Sans KR",sans-serif; background:#fff; color:#111; }
    .wrap{ width:min(980px, 92vw); margin:0 auto; padding:18px 0 44px; }
    h1{ margin:14px 0 18px; text-align:center; font-weight:900; font-size:28px; }
    .card{ border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:14px; }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .input{ height:48px; border:2px solid var(--b); border-radius:12px; padding:10px 12px; font-size:15px; outline:none; }
    .btn{ height:48px; border:2px solid var(--b); border-radius:12px; background:#fff; font-size:15px; font-weight:900; cursor:pointer; padding:0 14px; }
    .btn.danger{ border-color:#c00; color:#c00; }
    .btn.mini{ height:34px; font-size:13px; padding:0 10px; border-radius:10px; }
    .hint{ font-size:12px; color:var(--muted); margin-top:8px; white-space:pre-line; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th, td{ border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:middle; }
    th{ font-weight:900; background:#fafafa; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .right{ text-align:right; }
    .actions{ display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>RNLC 관리자</h1>

  <div class="card">
    <div class="row">
      <input id="pass" class="input" style="width:220px" placeholder="관리자 비밀번호(pass)"/>
      <button class="btn" id="btnLoad">불러오기</button>
      <button class="btn" id="btnRebuild">캐시 재계산</button>
      <button class="btn danger" id="btnMonthlyReset">월간 리셋(아카이브)</button>
      <a class="btn" href="?page=index" style="text-decoration:none; color:#111; display:inline-flex; align-items:center;">← 메인</a>
    </div>
    <div class="hint" id="statusHint">상태 불러오는 중...</div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3 style="margin:0 0 10px;">사전등록자(DB)</h3>
    <div class="row">
      <input id="pName" class="input" style="width:240px" placeholder="등록/삭제할 이름"/>
      <button class="btn" id="btnAdd">등록</button>
      <button class="btn danger" id="btnRemove">삭제</button>
    </div>
    <div class="hint" id="rosterHint">-</div>
  </div>

  <div class="card" style="margin-top:14px;">
    <div class="row" style="justify-content:space-between;">
      <h3 style="margin:0;">기록(entries)</h3>
      <div class="hint">수정: distance만 변경 / 삭제: 행 삭제 / 변경 후 자동 재계산</div>
    </div>

    <div class="row" style="margin-top:10px;">
      <input id="filterName" class="input" style="width:220px" placeholder="이름 필터(선택)"/>
      <button class="btn" id="btnFilter">조회</button>
      <button class="btn" id="btnClear">필터 해제</button>
    </div>

    <div style="overflow:auto; margin-top:10px;">
      <table>
        <thead>
          <tr>
            <th class="mono">ts</th>
            <th>data</th>
            <th>name</th>
            <th class="right">distance</th>
            <th class="right">effective</th>
            <th>counted</th>
            <th>monthKey</th>
            <th>note</th>
            <th class="right">관리</th>
          </tr>
        </thead>
        <tbody id="entriesBody">
          <tr><td colspan="9" class="hint">불러오기 전</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  function pass(){ return document.getElementById("pass").value.trim(); }

  let activeMonth = null;
  let rowsCache = [];

  function setStatus(text){ document.getElementById("statusHint").textContent = text; }

  function loadStatus(){
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return setStatus("상태 불러오기 실패");
      activeMonth = out.activeMonth;
      setStatus(`활성 월: ${activeMonth}`);
    }).apiStatus();
  }

  function loadRoster(){
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return document.getElementById("rosterHint").textContent = out?.error || "불러오기 실패";
      const list = (out.roster||[]).map(x=>x.name);
      document.getElementById("rosterHint").textContent = `등록자 ${list.length}명`;
    }).apiAdminRoster(pass());
  }

  function renderEntries(rows){
    const body = document.getElementById("entriesBody");
    if(!rows || !rows.length){
      body.innerHTML = `<tr><td colspan="9" class="hint">데이터 없음</td></tr>`;
      return;
    }
    rowsCache = rows.slice();
    body.innerHTML = rows.map(r=>`
      <tr>
        <td class="mono">${r.ts||""}</td>
        <td>${(r.data||"").slice(0,16)}</td>
        <td>${r.name||""}</td>
        <td class="right mono">${r.distance ?? ""}</td>
        <td class="right mono">${r.effectiveDistance ?? ""}</td>
        <td class="mono">${r.counted||""}</td>
        <td class="mono">${r.monthKey||""}</td>
        <td class="mono">${r.note||""}</td>
        <td class="right">
          <div class="actions">
            <button class="btn mini" onclick="editEntry(${r.ts}, ${r.distance||0})">수정</button>
            <button class="btn mini danger" onclick="deleteEntry(${r.ts})">삭제</button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  function loadEntries(){
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return renderEntries([]);
      renderEntries(out.rows || []);
    }).apiAdminGetEntries(pass(), document.getElementById("filterName").value.trim(), 400);
  }

  window.editEntry = function(ts, oldDist){
    const nd = prompt("새 거리(km)를 입력해 주세요.", String(oldDist||""));
    if(!nd) return;
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return alert(out?.error || "수정 실패");
      loadEntries();
    }).apiAdminEditEntry(pass(), String(ts), nd);
  }

  window.deleteEntry = function(ts){
    if(!confirm("정말 삭제하시겠습니까?")) return;
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return alert(out?.error || "삭제 실패");
      loadEntries();
    }).apiAdminDeleteEntry(pass(), String(ts));
  }

  function addParticipant(){
    const name = document.getElementById("pName").value.trim();
    if(!name) return;
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return alert(out?.error || "등록 실패");
      loadRoster();
    }).apiAdminAddParticipant(pass(), name);
  }

  function removeParticipant(){
    const name = document.getElementById("pName").value.trim();
    if(!name) return;
    if(!confirm("삭제하시겠습니까?")) return;
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return alert(out?.error || "삭제 실패");
      loadRoster();
    }).apiAdminRemoveParticipant(pass(), name);
  }

  function rebuildCache(){
    if(!confirm("활성 월 캐시를 재계산하시겠습니까?")) return;
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return alert(out?.error || "재계산 실패");
      alert(`재계산 완료\n월: ${out.monthKey}\n인원: ${out.count}`);
      loadEntries();
    }).apiAdminRebuildCache(pass());
  }

  function monthlyReset(){
    if(!confirm("월간 리셋(아카이브)을 실행하시겠습니까?")) return;
    google.script.run.withSuccessHandler((out)=>{
      if(!out || !out.ok) return alert(out?.error || "리셋 실패");
      alert(`아카이브: ${out.archivedMonth}\n새 활성 월: ${out.newActiveMonth}`);
      loadStatus();
      loadEntries();
    }).apiAdminMonthlyReset(pass());
  }

  document.getElementById("btnLoad").addEventListener("click", ()=>{
    loadStatus();
    loadRoster();
    loadEntries();
  });
  document.getElementById("btnFilter").addEventListener("click", loadEntries);
  document.getElementById("btnClear").addEventListener("click", ()=>{
    document.getElementById("filterName").value="";
    loadEntries();
  });
  document.getElementById("btnAdd").addEventListener("click", addParticipant);
  document.getElementById("btnRemove").addEventListener("click", removeParticipant);
  document.getElementById("btnRebuild").addEventListener("click", rebuildCache);
  document.getElementById("btnMonthlyReset").addEventListener("click", monthlyReset);

  loadStatus();
</script>
</body>
</html>
